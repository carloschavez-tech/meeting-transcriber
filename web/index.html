<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grabador de Reuniones</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --red: #e5484d;
    --red-dark: #c7373c;
    --green: #16a34a;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card: #212327;
      --text: #f2f3f5;
      --muted: #9aa0aa;
      --border: #33353a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px 32px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    text-align: center;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .rec-button {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: none;
    background: var(--red);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 6px 20px rgba(229, 72, 77, 0.35);
  }
  .rec-button:hover:not(:disabled) { transform: scale(1.04); }
  .rec-button:active:not(:disabled) { transform: scale(0.97); }
  .rec-button:disabled { cursor: default; opacity: 0.6; }
  .rec-button .icon {
    width: 36px;
    height: 36px;
    display: block;
  }
  .rec-button.recording {
    background: var(--red-dark);
    animation: pulse 1.6s infinite;
  }
  .rec-button.processing {
    background: var(--muted);
    box-shadow: none;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0.45); }
    50% { box-shadow: 0 0 0 14px rgba(229, 72, 77, 0); }
  }
  .status {
    margin-top: 22px;
    font-size: 0.95rem;
    color: var(--muted);
    min-height: 1.4em;
  }
  .status.recording { color: var(--red-dark); font-weight: 600; }
  .status.done { color: var(--green); font-weight: 600; }
  .status.error { color: var(--red); font-weight: 600; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--muted);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .report {
    display: none;
    margin-top: 28px;
    text-align: left;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .report.visible { display: block; }
  .report h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .report-body {
    font-size: 0.88rem;
    line-height: 1.55;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .report-body h3 { font-size: 0.95rem; margin: 16px 0 6px; }
  .report-body h4 { font-size: 0.9rem; margin: 12px 0 4px; color: var(--muted); }
  .report-body ul, .report-body ol { margin: 4px 0 10px; padding-left: 20px; }
  .report-body p { margin: 6px 0; }
  .report-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .report-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.82rem;
    background: color-mix(in srgb, var(--text) 8%, transparent);
    padding: 1px 4px;
    border-radius: 4px;
  }
  .report-body pre {
    background: color-mix(in srgb, var(--text) 6%, transparent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .report-body pre code { background: none; padding: 0; }
  .report-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 14px;
    font-size: 0.84rem;
  }
  .report-body th, .report-body td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }
  .report-body th { background: color-mix(in srgb, var(--text) 5%, transparent); font-weight: 600; }

  .live {
    display: none;
    margin-top: 24px;
    text-align: left;
    background: color-mix(in srgb, var(--amber, #f59e0b) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--amber, #f59e0b) 35%, transparent);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .live.visible { display: block; }
  .live h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
    color: #b45309;
  }
  .live-body { font-size: 0.88rem; line-height: 1.5; }
  .live-body ul { margin: 0; padding-left: 20px; }
  .live-body p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Grabador de Reuniones</h1>
    <div class="subtitle">Grabá, transcribí y generá el informe con un click</div>

    <button id="recBtn" class="rec-button">
      <svg class="icon" id="recIcon" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="9"/></svg>
    </button>

    <div id="status" class="status">Listo para grabar.</div>
    <div id="timer" class="timer"></div>

    <div id="liveSection" class="live">
      <h2>💡 Preguntas sugeridas para el cliente</h2>
      <div id="liveBody" class="live-body"></div>
    </div>

    <div id="reportSection" class="report">
      <h2>Informe de la reunión</h2>
      <div id="reportBody" class="report-body"></div>
    </div>

    <div id="specSection" class="report">
      <h2>Spec de dominio</h2>
      <div id="specBody" class="report-body"></div>
    </div>
  </div>

<script>
const recBtn = document.getElementById('recBtn');
const recIcon = document.getElementById('recIcon');
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer');
const reportSection = document.getElementById('reportSection');
const reportBody = document.getElementById('reportBody');
const specSection = document.getElementById('specSection');
const specBody = document.getElementById('specBody');
const liveSection = document.getElementById('liveSection');
const liveBody = document.getElementById('liveBody');
let lastLiveSuggestions = null;

let pollTimer = null;
let recordStartedAt = null;
let timerInterval = null;

function fmtElapsed(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function startTimer() {
  recordStartedAt = Date.now();
  timerInterval = setInterval(() => {
    timerEl.textContent = fmtElapsed((Date.now() - recordStartedAt) / 1000);
  }, 500);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerEl.textContent = '';
}

function inlineFmt(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
}

function renderMarkdown(md) {
  // Conversión liviana de Markdown a HTML: encabezados, listas (con viñetas
  // y numeradas), tablas, bloques de código, negrita y párrafos. Suficiente
  // para el informe y el spec, sin depender de ninguna librería externa.
  const escaped = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = escaped.split('\n');
  let html = '';
  let listType = null;
  let tableRows = null;
  let i = 0;

  function closeList() {
    if (listType) { html += `</${listType}>`; listType = null; }
  }
  function closeTable() {
    if (tableRows) {
      html += '<table>' + tableRows.map((row, idx) => {
        const tag = idx === 0 ? 'th' : 'td';
        return '<tr>' + row.map((cell) => `<${tag}>${inlineFmt(cell)}</${tag}>`).join('') + '</tr>';
      }).join('') + '</table>';
      tableRows = null;
    }
  }

  while (i < lines.length) {
    const trimmed = lines[i].trim();

    if (trimmed.startsWith('```')) {
      closeList(); closeTable();
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) {
        codeLines.push(lines[i]);
        i++;
      }
      html += `<pre><code>${codeLines.join('\n')}</code></pre>`;
      i++;
      continue;
    }

    if (/^\|.*\|$/.test(trimmed)) {
      closeList();
      const cells = trimmed.slice(1, -1).split('|').map((c) => c.trim());
      // Fila separadora tipo |---|---|---| o |:---|:---:|---:| — se salta,
      // sin importar cuántas columnas tenga.
      if (cells.every((c) => /^:?-+:?$/.test(c))) { i++; continue; }
      tableRows = tableRows || [];
      tableRows.push(cells);
      i++;
      continue;
    } else {
      closeTable();
    }

    if (/^#{3,4}\s+/.test(trimmed)) {
      closeList();
      html += `<h4>${inlineFmt(trimmed.replace(/^#{3,4}\s+/, ''))}</h4>`;
    } else if (/^##\s+/.test(trimmed)) {
      closeList();
      html += `<h3>${inlineFmt(trimmed.replace(/^##\s+/, ''))}</h3>`;
    } else if (/^#\s+/.test(trimmed)) {
      closeList();
      html += `<h3>${inlineFmt(trimmed.replace(/^#\s+/, ''))}</h3>`;
    } else if (/^-\s+/.test(trimmed)) {
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inlineFmt(trimmed.replace(/^-\s+/, ''))}</li>`;
    } else if (/^\d+\.\s+/.test(trimmed)) {
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inlineFmt(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
    } else if (trimmed === '---') {
      closeList();
      html += '<hr>';
    } else if (trimmed === '') {
      closeList();
    } else {
      closeList();
      html += `<p>${inlineFmt(trimmed)}</p>`;
    }
    i++;
  }
  closeList();
  closeTable();
  return html;
}

async function loadReport() {
  try {
    const res = await fetch('/api/last-report');
    if (!res.ok) return;
    const data = await res.json();
    reportBody.innerHTML = renderMarkdown(data.report);
    reportSection.classList.add('visible');
  } catch (e) { /* silencioso */ }
}

async function loadSpec() {
  try {
    const res = await fetch('/api/last-spec');
    if (!res.ok) return;
    const data = await res.json();
    specBody.innerHTML = renderMarkdown(data.spec);
    specSection.classList.add('visible');
  } catch (e) { /* silencioso */ }
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// La lista de preguntas solo crece (nunca se reemplaza ni se reordena), para
// no confundir a quien la está mirando en medio de la reunión.
function updateLiveSuggestions(state) {
  const questions = Array.isArray(state.live_suggestions) ? state.live_suggestions : [];
  if (state.status !== 'recording' || questions.length === 0) {
    if (state.status !== 'recording') liveSection.classList.remove('visible');
    return;
  }
  if (questions.length !== lastLiveSuggestions) {
    liveBody.innerHTML = '<ul>' + questions.map((q) => `<li>${escapeHtml(q)}</li>`).join('') + '</ul>';
    lastLiveSuggestions = questions.length;
  }
  liveSection.classList.add('visible');
}

function setIcon(svgInner) {
  // Siempre volvemos a buscar el elemento en el DOM: outerHTML lo reemplaza,
  // así que una referencia guardada en una variable queda obsoleta.
  const el = document.getElementById('recIcon');
  if (el) el.outerHTML = `<svg class="icon" id="recIcon" viewBox="0 0 24 24" fill="white">${svgInner}</svg>`;
}

function applyState(state) {
  statusEl.textContent = state.message || '';
  statusEl.className = 'status ' + state.status;
  recBtn.className = 'rec-button';

  if (state.status === 'recording') {
    recBtn.classList.add('recording');
    setIcon('<rect x="6" y="6" width="12" height="12" rx="2"/>');
    recBtn.disabled = false;
    if (!recordStartedAt) startTimer();
  } else if (state.status === 'processing') {
    recBtn.classList.add('processing');
    recBtn.disabled = true;
    stopTimer();
    setIcon('<circle cx="12" cy="12" r="9"/>');
  } else {
    recBtn.disabled = false;
    stopTimer();
    setIcon('<circle cx="12" cy="12" r="9"/>');
  }

  if (state.status === 'done') {
    loadReport();
    loadSpec();
  }

  updateLiveSuggestions(state);
}

async function poll() {
  clearTimeout(pollTimer);
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('status ' + res.status);
    const state = await res.json();
    applyState(state);
    if (state.status === 'recording' || state.status === 'processing') {
      pollTimer = setTimeout(poll, 1200);
    }
  } catch (e) {
    // Sin conexión con el servidor (ej. se cerró la ventana de Terminal).
    // Reactivamos el botón para que el usuario pueda reintentar en vez de
    // quedar bloqueado, y seguimos intentando reconectar de fondo.
    statusEl.textContent = 'No puedo conectar con la app. ¿Sigue abierta la ventana de Terminal?';
    statusEl.className = 'status error';
    recBtn.disabled = false;
    pollTimer = setTimeout(poll, 2000);
  }
}

recBtn.addEventListener('click', async () => {
  recBtn.disabled = true;
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('No se pudo consultar el estado (' + res.status + ').');
    const state = await res.json();

    if (state.status === 'recording') {
      const r = await fetch('/api/stop', { method: 'POST' });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.error || 'No se pudo detener la grabación.');
      }
    } else if (state.status !== 'processing') {
      reportSection.classList.remove('visible');
      specSection.classList.remove('visible');
      liveSection.classList.remove('visible');
      lastLiveSuggestions = null;
      recordStartedAt = null;
      const r = await fetch('/api/start', { method: 'POST' });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(err.error || 'No se pudo empezar a grabar.');
      }
    }
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.className = 'status error';
  } finally {
    // poll() siempre corre al final, así el botón nunca queda pegado en
    // "deshabilitado": actualiza el estado real (o reactiva el botón si
    // no puede conectarse).
    poll();
  }
});

poll();
</script>
</body>
</html>
